<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Preview da tela Minha Jornada gamificada</title>
  <desc id="desc">Mock visual da tela com hero de rank e XP, stepper de etapas e cards de simulacao e resultado.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#dfe9f5"/>
    </linearGradient>

    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="cardSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff4ef"/>
    </linearGradient>

    <linearGradient id="celebration" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7f1d1d" flood-opacity="0.18"/>
    </filter>

    <style>
      .label { font: 600 14px 'Manrope', 'Segoe UI', sans-serif; fill: #6e4d54; }
      .h1 { font: 800 38px 'Manrope', 'Segoe UI', sans-serif; fill: #fff; }
      .h2 { font: 800 22px 'Manrope', 'Segoe UI', sans-serif; fill: #2b1220; }
      .text { font: 500 15px 'Manrope', 'Segoe UI', sans-serif; fill: #fef2f2; }
      .body { font: 500 14px 'Manrope', 'Segoe UI', sans-serif; fill: #65444b; }
      .chip { font: 700 13px 'Manrope', 'Segoe UI', sans-serif; fill: #fff; }
      .chipDark { font: 700 12px 'Manrope', 'Segoe UI', sans-serif; fill: #5b2f1d; }
      .cardTitle { font: 700 17px 'Manrope', 'Segoe UI', sans-serif; fill: #311827; }
      .small { font: 700 11px 'Manrope', 'Segoe UI', sans-serif; fill: #9a7080; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="url(#bg)"/>

  <rect x="42" y="38" width="300" height="904" rx="22" fill="#0f1724"/>
  <text x="74" y="96" class="h2" fill="#f8fafc">aprende.AI</text>
  <text x="74" y="122" class="label" fill="#8ea3be">Minha Jornada</text>

  <rect x="74" y="168" width="236" height="74" rx="14" fill="#1a2840" stroke="#2d4670"/>
  <text x="90" y="196" class="small" fill="#9db7d5">ETAPA ATUAL</text>
  <text x="90" y="220" class="chip">Plano Estratégico</text>

  <rect x="74" y="262" width="236" height="58" rx="12" fill="#122033"/>
  <text x="90" y="296" class="body" fill="#d4e3f4">Contexto, Diagnóstico, Plano...</text>

  <rect x="374" y="38" width="1024" height="904" rx="24" fill="#f9fcff" stroke="#dbe4ee"/>

  <rect x="410" y="84" width="952" height="206" rx="26" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="446" y="132" class="small" fill="#ffe4ef">MISSÃO DE HOJE</text>
  <text x="446" y="178" class="h1">Replanejar sprint crítico</text>
  <text x="446" y="208" class="text">Decisão sob pressão com impacto real em prazo, risco e equipe.</text>

  <rect x="446" y="226" width="168" height="28" rx="14" fill="rgba(255,255,255,0.22)"/>
  <text x="465" y="245" class="chip">👑 Rank: Estratégista</text>

  <rect x="624" y="226" width="130" height="28" rx="14" fill="rgba(251,191,36,0.28)" stroke="rgba(255,255,255,0.35)"/>
  <text x="644" y="245" class="chip">🔥 8 dias</text>

  <rect x="446" y="262" width="500" height="10" rx="999" fill="rgba(255,255,255,0.35)"/>
  <rect x="446" y="262" width="330" height="10" rx="999" fill="url(#xp)"/>
  <text x="952" y="271" class="chip">830 / 1200 XP</text>

  <rect x="990" y="112" width="340" height="156" rx="18" fill="rgba(64,16,30,0.24)" stroke="rgba(255,255,255,0.3)"/>
  <text x="1014" y="140" class="small" fill="#ffd9e7">OBJETIVOS DA ETAPA</text>
  <text x="1014" y="167" class="chip">✅ Ler contexto e riscos</text>
  <text x="1014" y="192" class="chip">⚡ Definir estratégia principal</text>
  <text x="1014" y="217" class="chip">🔒 Preparar simulação</text>
  <text x="1014" y="248" class="chip">+80 XP ao concluir</text>

  <rect x="410" y="322" width="952" height="86" rx="18" fill="#fff" stroke="#ffd6cf"/>
  <text x="434" y="354" class="small">PROGRESSO</text>

  <g transform="translate(432,366)">
    <rect x="0" y="0" width="150" height="30" rx="12" fill="#ecfdf3" stroke="#86efac"/>
    <text x="12" y="20" class="chipDark">✅ Contexto +30 XP</text>

    <rect x="160" y="0" width="150" height="30" rx="12" fill="#ecfdf3" stroke="#86efac"/>
    <text x="172" y="20" class="chipDark">✅ Capacitação +50 XP</text>

    <rect x="320" y="0" width="150" height="30" rx="12" fill="#ffe8df" stroke="#fb923c"/>
    <text x="332" y="20" class="chipDark">▶ Decisão +80 XP</text>

    <rect x="480" y="0" width="150" height="30" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
    <text x="492" y="20" class="chipDark">🔒 Simulação +60 XP</text>

    <rect x="640" y="0" width="150" height="30" rx="12" fill="#f8fafc" stroke="#d1d5db"/>
    <text x="652" y="20" class="chipDark">🔒 Resultado +100 XP</text>
  </g>

  <rect x="410" y="430" width="616" height="236" rx="20" fill="url(#cardSoft)" stroke="#ffd7cc" filter="url(#shadow)"/>
  <text x="438" y="468" class="small">DECISÃO ESTRATÉGICA</text>
  <text x="438" y="498" class="cardTitle">Qual caminho você escolhe?</text>
  <text x="438" y="526" class="body">Opção A: Entregar rápido e assumir risco operacional.</text>
  <text x="438" y="552" class="body">Opção B: Alinhar riscos e garantir consistência.</text>

  <rect x="438" y="576" width="560" height="14" rx="999" fill="#ffe4dc"/>
  <rect x="438" y="576" width="402" height="14" rx="999" fill="url(#hero)"/>
  <text x="854" y="587" class="chipDark">Confiança: 72%</text>

  <rect x="438" y="604" width="214" height="36" rx="12" fill="#fff3ef" stroke="#ffc7b7"/>
  <text x="455" y="627" class="chipDark">⚡ Potencial da opção: +80 XP</text>

  <rect x="1044" y="430" width="318" height="236" rx="20" fill="#fff" stroke="#ffd7cc"/>
  <text x="1068" y="468" class="small">SIMULAÇÃO</text>
  <text x="1068" y="498" class="cardTitle">Impacto previsto</text>

  <text x="1068" y="528" class="body">Velocidade</text>
  <rect x="1165" y="518" width="170" height="12" rx="999" fill="#ffe4db"/>
  <rect x="1165" y="518" width="136" height="12" rx="999" fill="url(#hero)"/>

  <text x="1068" y="556" class="body">Análise de risco</text>
  <rect x="1165" y="546" width="170" height="12" rx="999" fill="#ffe4db"/>
  <rect x="1165" y="546" width="92" height="12" rx="999" fill="url(#hero)"/>

  <text x="1068" y="584" class="body">Consistência</text>
  <rect x="1165" y="574" width="170" height="12" rx="999" fill="#ffe4db"/>
  <rect x="1165" y="574" width="122" height="12" rx="999" fill="url(#hero)"/>

  <rect x="410" y="688" width="952" height="216" rx="22" fill="url(#celebration)" filter="url(#shadow)"/>
  <text x="442" y="738" class="small" fill="#c4b5fd">RESULTADO FINAL</text>
  <text x="442" y="778" class="h1" style="font-size:32px">🏆 Missão concluída com sucesso</text>
  <text x="442" y="807" class="text">Nota A • +320 XP total • 3 conquistas desbloqueadas</text>

  <rect x="980" y="724" width="166" height="42" rx="999" fill="#fef3c7"/>
  <text x="1004" y="751" class="chipDark">⚡ +320 XP</text>

  <rect x="1160" y="724" width="166" height="42" rx="999" fill="#ddd6fe"/>
  <text x="1182" y="751" class="chip">⭐ Nível 12</text>

  <rect x="980" y="778" width="346" height="88" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)"/>
  <text x="1004" y="810" class="chip">🎯 Decisor Estratégico</text>
  <text x="1004" y="835" class="chip">📈 Combo de Análise</text>
</svg>
