services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aprende_ai}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-aprende_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3015
      JWT_SECRET: ${JWT_SECRET:-aprende_ai_dev_secret_CHANGE_IN_PROD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aprende_ai}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_LOGGING: ${DB_LOGGING:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "${API_PORT:-3015}:3015"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3015/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/aprende-ai}
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/aprende-ai/}
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-demo}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  db_data:
