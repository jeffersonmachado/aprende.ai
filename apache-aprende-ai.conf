# Configuracao Apache para aprende-ai
# Adicionar estas linhas no VirtualHost 127.0.0.1:443 (ou vhost alvo)
# Servidor Docker: 10.10.2.30:8088
# Servidor Apache: 10.10.2.55
#
# IMPORTANTE:
# 1) Ajuste IP/porta conforme seu deploy (FRONTEND_PORT no docker-compose)
# 2) Esta configuracao assume o app publicado no prefixo /aprende-ai
# 3) Coloque as regras especificas ANTES do ProxyPass catch-all de /aprende-ai

# API do aprende-ai
ProxyPass        "/aprende-ai/api"   "http://10.10.2.30:8088/api" nocanon
ProxyPassReverse "/aprende-ai/api"   "http://10.10.2.30:8088/api"

# Auth do aprende-ai
ProxyPass        "/aprende-ai/auth"  "http://10.10.2.30:8088/auth" nocanon
ProxyPassReverse "/aprende-ai/auth"  "http://10.10.2.30:8088/auth"

# Healthcheck do aprende-ai
ProxyPass        "/aprende-ai/health" "http://10.10.2.30:8088/health"
ProxyPassReverse "/aprende-ai/health" "http://10.10.2.30:8088/health"

# Assets do aprende-ai
ProxyPass        "/aprende-ai/assets" "http://10.10.2.30:8088/assets" nocanon
ProxyPassReverse "/aprende-ai/assets" "http://10.10.2.30:8088/assets"

# Rota principal (frontend SPA + fallback)
# IMPORTANTE: deixar por ultimo (catch-all)
ProxyPass        "/aprende-ai" "http://10.10.2.30:8088" nocanon
ProxyPassReverse "/aprende-ai" "http://10.10.2.30:8088"

# Ajusta caminho de cookies para o prefixo /aprende-ai
ProxyPassReverseCookiePath "/" "/aprende-ai/"

# Observacao de build frontend:
# Para funcionar 100% sob prefixo /aprende-ai, gere o frontend com:
# - base '/aprende-ai/' no Vite
# - VITE_API_BASE_URL='/aprende-ai'
# Se o build estiver em base '/', as URLs absolutas (/assets, /api) podem exigir
# regras adicionais no Apache em nivel raiz.
